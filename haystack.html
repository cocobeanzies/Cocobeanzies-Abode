  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="title" property="og:title" content="Wordle in a Haystack" />
  <meta name="description" property="og:description" content="Worst-case scenario Wordles - Inspired by https://qntm.org/files/absurdle/absurdle.html" />
  <meta property="og:image" content="https://mizabot.xyz/u/6rO-v_b0JRif98NyD-N-f9xsAFRzZg/image.png" />
  <title>Wordle in a Haystack</title>
  <style>
	:root{
	  --bg:#121213; --cell:#3a3a3c; --text:#d7dadc; --muted:#818384;
	  --green:#538d4e; --yellow:#b59f3b; --gray:#3a3a3c;
	  --accent:#10a37f;
	}
	html,body{height:100%;overflow-x:hidden}
	body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;padding:0px}
	.app{min-width:240px;max-width:540px;width:clamp(33%,33vh,100%)}
	header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
	h1{font-size:20px;margin:0}
	p.lead{margin:0;color:var(--muted);font-size:13px}

	.board{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;margin:0 0}
	.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
	.cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;border:2px solid rgba(255,255,255,0.06);font-weight:700;font-size:22px;text-transform:uppercase}
	.cell.filled{border-color:rgba(255,255,255,0.12)}
	.cell.correct{background:var(--green);border:0;color:white}
	.cell.present{background:var(--yellow);border:0;color:white}
	.cell.absent{background:var(--gray);border:0;color:white}

	.keyboard{margin-top:10px;display:flex;flex-direction:column;gap:2px;user-select:none}
	.keyrow{display:flex;gap:2px;justify-content:center}
	.key{padding:clamp(10px,1.5vh,56px) 1px;border-radius:6px;background:#818384;color:white;min-width:clamp(28px,10%,64px);text-align:center;font-weight:700;cursor:pointer}
	.key.wide{min-width:clamp(48px,15%,80px)}
	.key.correct{background:var(--green)}
	.key.present{background:var(--yellow)}
	.key.absent{background:var(--gray)}

	.controls{display:flex;gap:8px;align-items:center;margin-top:12px}
	button.btn{background:#222;padding:8px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.04);color:var(--text);cursor:pointer}
	.muted{color:var(--muted);font-size:13px}

	<!-- footer{margin-top:12px;color:var(--muted);font-size:12px} -->

	/* small screens tweak */
	@media (max-width:420px){.cell{font-size:16px}}
  </style>
</head>

	ALLWORDS = {}
	WORDS.forEach(k => ALLWORDS[k] = 2);
	PLURALS.forEach(k => ALLWORDS[k] = 1);
	const WORDMAP = {};
	const HASDUPS = {};
	for (const word in ALLWORDS) {
		for (const c of word) {
			if (!WORDMAP[c]) {
				WORDMAP[c] = Object.fromEntries([[word, 1]]);
			} else {
				const v = (WORDMAP[c][word] || 0) + 1;
				WORDMAP[c][word] = v;
				if (v > 1) {
					HASDUPS[word] = 1;
				}
			}
		}
	}

	// ====== game state ======
	const WORD_LEN = 5, MAX_ROWS = 6;
	var CURR_ROWS = MAX_ROWS;
	let POSSIBLE = [];
	let solution = '';
	let board = [];
	let currentRow = 0, currentCol = 0, gameOver=false;
	const boardEl = document.getElementById('board');
	const keyboardEl = document.getElementById('keyboard');
	const guessCounter = document.getElementById('guessCount');

	function pickSolution(seed){
	  if(seed && seed.length===WORD_LEN && /^[A-Z]+$/.test(seed)) return seed;
	  return WORDS[Math.floor(Math.random()*WORDS.length)];
	}

	function buildBoard(){
	  boardEl.innerHTML='';
	  for(let r=0;r<CURR_ROWS;r++){
		const row = document.createElement('div'); row.className='row';
		for(let c=0;c<WORD_LEN;c++){
		  const cell = document.createElement('div'); cell.className='cell'; cell.dataset.r=r; cell.dataset.c=c;
		  cell.textContent = board[r][c] || '';
		  row.appendChild(cell);
		}
		boardEl.appendChild(row);
	  }
	}

	const KEY_LAYOUT = ["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];
	function buildKeyboard(){
	  keyboardEl.innerHTML='';
	  KEY_LAYOUT.forEach((row,ri)=>{
		const r = document.createElement('div'); r.className='keyrow';
		if(ri===2){
		  const enter = document.createElement('div'); enter.className='key wide'; enter.textContent='Enter'; enter.onclick=onEnter; r.appendChild(enter);
		}
		row.split('').forEach(kch=>{
		  const key = document.createElement('div'); key.className='key'; key.textContent=kch; key.dataset.key=kch; key.onclick=()=>onKey(kch);
		  r.appendChild(key);
		});
		if(ri===2){
		  const del = document.createElement('div'); del.className='key wide'; del.textContent='Del'; del.onclick=onBack; r.appendChild(del);
		}
		keyboardEl.appendChild(r);
	  })
	}

	function onKey(ch){ if(gameOver) return; if(currentCol<WORD_LEN){ board[currentRow][currentCol]=ch; currentCol++; renderRow(currentRow);} }
	function onBack(){ if(gameOver) return; if(currentCol>0){ currentCol--; board[currentRow][currentCol]=''; renderRow(currentRow);} }

	function validWord(w){
	  return ALLWORDS[w.toUpperCase()];
	}

	function onEnter(){ if(gameOver) return; const guess = board[currentRow].join(''); if(guess.length!==WORD_LEN) return flashRow(currentRow);
	  if(!validWord(guess)){ flashRow(currentRow); return }
	  evaluateGuess(guess);
	}

	function flashRow(r){
	  const row = boardEl.children[r]; row.animate([{transform:'translateY(-6px)'},{transform:'translateY(0)'}],{duration:180,iterations:1});
	}

	function evaluateSubset(guess, cols) {
		let remaining = POSSIBLE;
		for (const i in cols) {
			const condition = cols[i];
			const c = guess[i];
			const req = WORDMAP[c][guess] || 0;
			if (condition == 2) {
				remaining = remaining.filter((w) => w[i] == c);
			} else if (condition == 1) {
				remaining = remaining.filter((w) => w[i] != c && WORDMAP[c][w] >= req);
			} else {
				remaining = remaining.filter((w) => w[i] != c && !(WORDMAP[c][w] >= req));
			}
		}
		if (!HASDUPS[guess]) return remaining;
		const output = [];
		for (const w of remaining) {
			let valid = true;
			const solChars = w.split('');
			for(let i = 0; i < WORD_LEN; i++) {
				if (cols[i] == 2) {
					solChars[i] = null;
				}
			}
			for (let i = 0; i < WORD_LEN; i++) {
				if (cols[i] == 2) continue;
				const idx = solChars.indexOf(guess[i]);
				if (idx >= 0) {
					if (cols[i] != 1) {
						valid = false;
						break;
					}
					solChars[idx] = null;
				} else {
					if (cols[i] != 0) {
						valid = false;
						break;
					}
				}
			}
			if (valid) output.push(w);
		}
		return output;
	}

	function subsetValue(remaining) {
		let value = 0;
		for (let i = 0; i < remaining.length; i++) {
			let sim = 1;
			const w1 = remaining[i];
			for (let j = i + 1; j < remaining.length; j++) {
				let close = 1;
				const w2 = remaining[j];
				for (const k in w1) {
					if (w1[k] == w2[k]) {
						close *= 3;
					} else if (WORDMAP[w1[k]][w2]) {
						close *= Math.sqrt(3);
					}
				}
				sim += close;
			}
			value += sim;
		}
		return value;
	}

	function evaluateSolution(guess) {
		const combs = Math.pow(3, WORD_LEN);
		let highest = -Infinity;
		let remaining = POSSIBLE;
		let remcol = null;
		const use_subsets = remaining.length < 2000;
		for (let i = 0; i < combs; i++) {
			const cols = [];
			for (let j = 0; j < WORD_LEN; j++) {
				const rem = Math.floor(i / Math.pow(3, j)) % 3;
				cols.push(rem);
			}
			const rem = evaluateSubset(guess, cols);
			let value = rem.length;
			if (rem.length > 1) {
				if (use_subsets) {
					value = subsetValue(rem);
				}
				for (let k = 0; k < WORD_LEN; k++) {
					value *= cols[k] + 1;
				}
			}
			console.log(cols, value, rem);
			if (value > highest) {
				highest = value;
				remaining = rem;
				remcol = cols;
			}
		}
		POSSIBLE = remaining;
		const word = POSSIBLE[Math.floor(Math.random() * POSSIBLE.length)];
		console.log([remcol.join(''), word, highest, remaining]);
		return word;
	}

	function evaluateGuess(guess){
	  solution = evaluateSolution(guess);

	  const solChars = solution.split('');
	  const result = Array(WORD_LEN).fill('absent');
	  // first pass: correct
	  for(let i=0;i<WORD_LEN;i++){
		if(guess[i] === solChars[i]){ result[i]='correct'; solChars[i]=null; }
	  }
	  // second pass: present
	  for(let i=0;i<WORD_LEN;i++){
		if(result[i]==='correct') continue;
		const idx = solChars.indexOf(guess[i]);
		if(idx>=0){ result[i]='present'; solChars[idx]=null; }
	  }

	  // apply to UI
	  const rowEl = boardEl.children[currentRow];
	  for(let i=0;i<WORD_LEN;i++){
		const cell = rowEl.children[i]; cell.classList.add('filled');
		cell.classList.add(result[i]);
	  }
	  // update keyboard
	  updateKeyboard(guess,result);

	  const guesses = currentRow + 1;
	  const s = guesses != 1 ? 'es' : '';
	  guessCounter.innerText = `${guesses} Guess${s}`;
	  if(guess === solution){ gameOver=true; setTimeout(()=>alert('You guessed it! \n' + shareText(true)),100); return }
	  currentRow++;
	  currentCol=0;
	  if(currentRow>=CURR_ROWS) {
		const row = document.createElement('div'); row.className='row';
		let r = CURR_ROWS;
		board.push(Array(WORD_LEN).fill(''));
		for(let c=0;c<WORD_LEN;c++){
		  const cell = document.createElement('div'); cell.className='cell'; cell.dataset.r=r; cell.dataset.c=c;
		  cell.textContent = board[r][c] || '';
		  row.appendChild(cell);
		}
		boardEl.appendChild(row);
		CURR_ROWS++;
	  }
	  // { gameOver=true; setTimeout(()=>alert('Out of guesses — word was: '+solution + '\n' + shareText(false)),100); }
	}

	function updateKeyboard(guess,result){
	  for(let i=0;i<WORD_LEN;i++){
		const key = keyboardEl.querySelector(`[data-key="${guess[i]}"]`);
		if(!key) continue;
		// priority: correct > present > absent
		if(result[i]==='correct') { key.classList.remove('present','absent'); key.classList.add('correct'); }
		else if(result[i]==='present' && !key.classList.contains('correct')) { key.classList.remove('absent'); key.classList.add('present'); }
		else if(result[i]==='absent' && !key.classList.contains('correct') && !key.classList.contains('present')){ key.classList.add('absent'); }
	  }
	}

	function renderRow(r){
	  const rowEl = boardEl.children[r];
	  for(let c=0;c<WORD_LEN;c++){ const cell = rowEl.children[c]; cell.textContent = board[r][c] || ''; cell.classList.toggle('filled', !!board[r][c]); }
	}

	// keyboard physical input
	document.addEventListener('keydown', e=>{
	  if(e.key==='Enter') return onEnter();
	  if(e.key==='Backspace') return onBack();
	  const k = e.key.toUpperCase(); if(/^[A-Z]$/.test(k)) onKey(k);
	});

	// New game / share
	// document.getElementById('newGame').addEventListener('click', ()=>{
	//   const seed = document.getElementById('seedWord').value.trim().toUpperCase();
	//   startGame(seed||null);
	// });
	// document.getElementById('shareRes').addEventListener('click', ()=>{ navigator.clipboard.writeText(shareText()).then(()=>alert('Result copied to clipboard')) });

	function shareText(win){
	  const lines = [];
	  const guessCount = guessCounter.innerText;
	  lines.push(`Wordle in a Haystack — ${guessCount}`);
	  for(let r=0;r<CURR_ROWS;r++){
		if(board[r].every(c=>!c)) break;
		if(boardEl.children[r]){
		  const cells = Array.from(boardEl.children[r].children).map(c=> c.classList.contains('correct')? '🟩' : c.classList.contains('present')? '🟨' : c.classList.contains('absent')? '⬛' : '⬜');
		  lines.push(cells.join(''));
		}
	  }
	  lines.push(`word: ${gameOver? solution: (document.getElementById('seedWord').value || '(hidden)')}`);
	  const wintext = lines.join('\n');
	  navigator.clipboard.writeText(wintext);
	  return wintext;
	}

	// Start game
	function startGame(seed){
	  POSSIBLE = Array.from(WORDS);
	  solution = pickSolution(seed);
	  board = Array.from({length:MAX_ROWS},()=>Array(WORD_LEN).fill(''));
	  currentRow=0; currentCol=0; gameOver=false;
	  buildBoard(); buildKeyboard();
	}

	// init
	startGame(null);
  </script>
</body>
